{% extends "base.html" %}

{% block title %}{{ post.title }} – PKSK{% endblock %}

{% block content %}
  <article>
    <h1>{{ post.title }}</h1>
    {% if post.published_at %}<p><time datetime="{{ post.published_at.isoformat() }}">{{ post.published_at.strftime('%d. %m. %Y') }}</time></p>{% endif %}
    <div>{{ post.body_html|safe }}</div>
  </article>
{% endblock %}
